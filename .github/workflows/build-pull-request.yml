name: ARW Small Projects Pull Request

on:
  pull_request

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'adopt'

    - name: Install Utilities
      run: apt install php

    - name: Build and Test
      run:  make run-demo
